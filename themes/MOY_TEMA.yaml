# Этот файл my_custom_theme.yaml не будет перезаписан обновлениями.

My Combined Theme:
  # Объединенные стили Mushroom и Compact Dashboard
  ha-badge-border-radius: 6px
  ha-card-box-shadow: 0px 2px 4px 0px rgba(0,0,0,0.16)
  ha-card-border-width: 0
  ha-card-border-radius: 6px
  ha-card-features-border-radius: 6px
  ha-tile-icon-border-radius: 6px
  mush-spacing: 8px
  mush-icon-border-radius: 6px
  mush-control-border-radius: 6px
  mush-chip-border-radius: 6px

  # Дополнительные стили для максимальной компактности
  card-mod-theme: My Combined Theme
  card-mod-card: |
    hui-masonry-view {
      --masonry-view-card-margin: 0px !important;
    }
    ha-card {
      margin: 0px !important;
    }

  modes:
    light: {}
    dark: {}

